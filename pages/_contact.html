<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | Task Partners</title>
    <meta name="description" content="Contacte o suporte da Task Partners.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0F172A">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="Página inicial da Task Partners"><span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Task Partners</span></a>
        <a class="btn btn-secondary" href="/">Voltar ao Início</a>
      </div>
    </header>

    <main class="legal-hero">
      <section class="container legal-content">
        <div class="legal-card">
          <span class="eyebrow">Suporte</span>
          <h1>Contactar a Task Partners</h1>
          <p>A nossa equipa de suporte pode ajudar com acesso à conta, recursos do produto, questões de faturação e pedidos de reembolso.</p>
          <div class="contact-panel">
            <strong>Suporte por Email</strong>
            <a href="mailto:support@taskpartners.online">support@taskpartners.online</a>
          </div>
          <form class="form" action="mailto:support@taskpartners.online" method="post" enctype="text/plain">
            <label for="name">Nome</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="message">Mensagem</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <button class="btn btn-primary" type="submit">Enviar Mensagem</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
