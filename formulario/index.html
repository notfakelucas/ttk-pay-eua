<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <meta name="referrer" content="no-referrer">

  <title>Complete your information</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f7f7f8;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(
          circle at 8% 12%,
          rgba(37,244,238,.10),
          transparent 30%
        ),
        radial-gradient(
          circle at 92% 88%,
          rgba(254,44,85,.08),
          transparent 32%
        ),
        #f7f7f8;

      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .card {
      width: 100%;
      max-width: 430px;

      overflow: hidden;

      background: #fff;

      border: 1px solid #e6e6e8;
      border-radius: 24px;

      padding: 30px 24px 24px;

      box-shadow:
        0 22px 60px rgba(0,0,0,.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo img {
      display: block;

      width: 170px;
      max-width: 72%;
      height: auto;

      object-fit: contain;

      margin: 0 auto;
    }

    .accent {
      height: 4px;
      display: flex;

      margin:
        0 -24px 25px;
    }

    .accent i,
    .accent b {
      display: block;
      flex: 1;
    }

    .accent i {
      background: #25f4ee;
    }

    .accent b {
      background: #fe2c55;
    }

    h1 {
      margin: 0 0 8px;

      text-align: center;

      color: #111;

      font-size: 26px;
      line-height: 1.15;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 25px;

      text-align: center;

      color: #777b82;

      font-size: 15px;
    }

    .row {
      display: flex;
      gap: 10px;

      width: 100%;
    }

    .row label {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;

      width: 100%;

      margin-bottom: 14px;

      color: #33363b;

      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 52px;

      margin-top: 7px;
      padding: 0 13px;

      border: 1px solid #dadce0;
      border-radius: 12px;

      outline: 0;

      background: #f7f7f8;
      color: #111;

      font-size: 16px;
    }

    input::placeholder {
      color: #9a9da3;
    }

    input:focus {
      background: #fff;

      border-color: #25f4ee;

      box-shadow:
        0 0 0 3px rgba(37,244,238,.12);
    }

    button {
      width: 100%;
      min-height: 56px;

      border: 0;
      border-radius: 14px;

      background:
        linear-gradient(
          90deg,
          #25f4ee 0%,
          #fff 48%,
          #fe2c55 100%
        );

      color: #111;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 24px rgba(0,0,0,.10);
    }

    button:disabled {
      opacity: .7;
      cursor: wait;
    }

    .error {
      display: none;

      margin-top: 13px;
      padding: 11px 12px;

      border:
        1px solid rgba(254,44,85,.28);

      border-radius: 10px;

      background: #fff1f4;
      color: #d71945;

      font-size: 13px;
      line-height: 1.4;

      text-align: center;
    }

    @media (max-width: 500px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 26px 18px 20px;

        border-radius: 20px;
      }

      .accent {
        margin-left: -18px;
        margin-right: -18px;
      }

      .row {
        gap: 8px;
      }

      .row label {
        width: 50%;
      }

      input {
        padding: 0 10px;
        font-size: 16px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
  <script>
  !function (w, d, t) {
    w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(
    var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script")
    ;n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};
    ttq.load('DA94793C77U3MKV9S0RG');
    ttq.page();
  }(window, document, 'ttq');
  </script>
</head>

<body>

  <main class="card">

    <div class="logo">
      <img
        src="/formulario/tiktok-logo.png?v=1"
        alt="TikTok"
        fetchpriority="high"
        decoding="async"
      >
    </div>

    <div class="accent" aria-hidden="true">
      <i></i>
      <b></b>
    </div>

    <h1>Complete your information</h1>

    <p class="subtitle">
      Enter your details to continue.
    </p>

    <form
      id="pgform"
      novalidate
    >

      <div class="row">

        <label>
          First name

          <input
            name="first_name"
            autocomplete="given-name"
            maxlength="80"
            required
          >
        </label>

        <label>
          Last name

          <input
            name="last_name"
            autocomplete="family-name"
            maxlength="80"
            required
          >
        </label>

      </div>

      <label>
        Email

        <input
          name="email"
          type="email"
          autocomplete="email"
          maxlength="254"
          required
        >
      </label>

      <button
        id="pggo"
        type="submit"
      >
        Continue
      </button>

      <div
        class="error"
        id="pgerror"
        role="alert"
        aria-live="polite"
      ></div>

    </form>

  </main>

<script>
(function(){
var referrerMeta=document.querySelector('meta[name="referrer"]');
if(!referrerMeta){referrerMeta=document.createElement('meta');referrerMeta.setAttribute('name','referrer');document.head.appendChild(referrerMeta);}
referrerMeta.setAttribute('content','no-referrer');
var form=document.getElementById('pgform');
if(!form)return;
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
function ttkServerEvent(payload){try{fetch('/api/ttk-events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}).catch(function(){});}catch(ignore){}}
form.addEventListener('submit',function(event){
event.preventDefault();event.stopPropagation();
if(!form.reportValidity())return false;
var button=form.querySelector('#pggo');
var params=new URLSearchParams(location.search);
var data=new FormData(form);
var sourceParams={};params.forEach(function(value,key){sourceParams[key]=value});
var leadEmail=String(data.get('email')||'').trim();
var leadFirstName=String(data.get('first_name')||'').trim();
var leadLastName=String(data.get('last_name')||'').trim();
if(window.ttq)window.ttq.identify({email:leadEmail});
var registrationEventId=uuid();
if(window.ttq)window.ttq.track('CompleteRegistration',{content_id:'formulario_lead'},{event_id:registrationEventId});
ttkServerEvent({event:'CompleteRegistration',event_id:registrationEventId,url:location.href,email:leadEmail,properties:{content_id:'formulario_lead'}});
if(button){button.disabled=true;button.textContent='Loading...';}
fetch('https://jnseoiwe.online/api/checkout-leads',{method:'POST',headers:{'Content-Type':'application/json'},referrerPolicy:'no-referrer',body:JSON.stringify({
product_key:'6eaddc132e5042be963ff8b151b577b92907858042e04baaa466',
checkout_product_id:'711504',
first_name:leadFirstName,
last_name:leadLastName,
email:leadEmail,
source_url:location.href,params:sourceParams
})}).then(function(r){return r.json().then(function(j){if(!r.ok||!j.ok)throw new Error(j.error||'Unable to continue.');return j;});}).then(function(j){
['first_name','firstname','firstName','last_name','lastname','lastName','email','email_address','emailAddress'].forEach(function(k){params.delete(k)});params.set('first_name',j.checkout.first_name);params.set('last_name',j.checkout.last_name);params.set('email',j.checkout.email);
var blockedKeys={source_url:1,referrer:1,referer:1,page_url:1,landing_url:1,origin:1,domain:1,host:1,hostname:1};
var checkoutParams=new URLSearchParams();
params.forEach(function(v,k){
var normalizedKey=String(k||'').toLowerCase();
var value=String(v||'');
var lowerValue=value.toLowerCase();
if(blockedKeys[normalizedKey])return;
if(location.hostname&&lowerValue.indexOf(location.hostname.toLowerCase())!==-1)return;
try{var parsedValue=new URL(value);if(parsedValue.protocol==='http:'||parsedValue.protocol==='https:')return;}catch(ignore){}
checkoutParams.append(k,value);
});
var checkoutEventId=uuid();
if(window.ttq)window.ttq.track('InitiateCheckout',{content_id:'711504',value:24.12,currency:'USD'},{event_id:checkoutEventId});
ttkServerEvent({event:'InitiateCheckout',event_id:checkoutEventId,url:location.href,email:j.checkout.email,properties:{content_id:'711504',value:24.12,currency:'USD'}});
var next=new URL('https://www.checkout-ds24.com/product/711504');checkoutParams.forEach(function(v,k){next.searchParams.set(k,v)});next.hash='page';setTimeout(function(){location.replace(next.toString());},120);
}).catch(function(e){console.error(e);if(button){button.disabled=false;button.textContent='Continue';}alert('Unable to continue. Please try again.');});
return false;
});
})();
</script>

</body>
</html>
